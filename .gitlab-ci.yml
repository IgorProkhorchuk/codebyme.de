stages:
  - test
  - build
  - package
  - deploy

.gradle-cache: &gradle-cache
  key: "gradle-cache"
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

variables:
  # Use Docker-in-Docker for building images
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# --- Stage 1: Tests ---
# Run backend tests
test-backend:
  stage: test
  image: gradle:jdk25-corretto
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
  cache:
    <<: *gradle-cache
  rules:
    - if: '$RUN_LABS_PIPELINE == "true" && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "devel" || $CI_COMMIT_BRANCH == "main")'
  script:
    - cd backend
    - ./gradlew test --no-daemon

# Run frontend checks (lint/types)
test-frontend:
  stage: test
  image: node:20-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "devel"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd frontend
    - npm ci
    - npm run check # Runs svelte-check (TypeScript validation)
    - npm run test:unit -- --run --project server
    - npm run build

# --- Stage 2: Build Native JAR ---
build-backend-jar:
  stage: build
  image: gradle:jdk25-corretto
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/backend/.gradle"
  cache:
    <<: *gradle-cache
  script:
    - cd backend
    - ./gradlew clean :app:bootJar -x test --no-daemon
  artifacts:
    paths:
      - backend/app/build/libs/*.jar
    expire_in: 1 hour
  rules:
    - if: '$RUN_LABS_PIPELINE == "true" && $CI_COMMIT_BRANCH == "main"'

# --- Stage 3: Build & Push Docker Images ---
# Only runs if tests pass
build-frontend-image:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build Frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Optional preparation for future Labs; normal blog pipelines skip Java entirely.
build-backend-image:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  rules:
    - if: '$RUN_LABS_PIPELINE == "true" && $CI_COMMIT_BRANCH == "main"'

# --- Stage 3: Deploy to Server ---
deploy-to-server:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install SSH client
    - apk add --no-cache openssh-client gettext
    # Setup SSH key
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    # 1. Substitute variables in docker-compose.prod.yml (populates image names)
    # We export the CI vars so envsubst can use them
    - export CI_PROJECT_NAMESPACE=$(echo "$CI_PROJECT_NAMESPACE" | tr '[:upper:]' '[:lower:]')
    - export CI_PROJECT_NAME=$(echo "$CI_PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
    - envsubst '$CI_PROJECT_NAMESPACE $CI_PROJECT_NAME' < docker-compose.prod.yml > docker-compose.final.yml
    
    # Only the blog is deployed; keep any existing server .env for optional Labs.
    - scp docker-compose.final.yml $SERVER_USER@$SERVER_IP:~/docker-compose.yml
    
    # 4. SSH in, move files to the correct folder, and update containers
    - ssh $SERVER_USER@$SERVER_IP "
        set -e;
        mkdir -p /srv/codebyme.de || true;
        mv ~/docker-compose.yml /srv/codebyme.de/docker-compose.yml;
        cd /srv/codebyme.de;
        
        echo 'Logging into GitLab Registry...';
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY;
        
        echo 'Pulling new images...';
        docker compose -p codebyme pull frontend;
        
        echo 'Restarting services...';
        docker compose -p codebyme --profile labs rm -sf backend db;
        docker compose -p codebyme up -d --no-deps frontend;
        
        echo 'Pruning old images...';
        docker image prune -f;
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
