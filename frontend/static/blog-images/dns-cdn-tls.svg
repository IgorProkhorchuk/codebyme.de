<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">DNS та HTTPS reverse proxy — різні етапи</title><desc id="desc">Спочатку DoH-resolver повертає браузеру адресу edge. Потім браузер встановлює окреме TLS-з'єднання з edge, який за потреби створює інше TLS-з'єднання до origin.</desc><defs><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#e67e22" stroke-width="1.6"/></marker><marker id="navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#52677e" stroke-width="1.6"/></marker></defs><rect width="1200" height="830" rx="20" fill="#f4f6f8"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#2c3e50" text-anchor="start">DNS знаходить адресу. Reverse proxy приймає HTTPS.</text><text x="40" y="92" font-size="22" fill="#66717e" text-anchor="start">Приклад: сайт за CDN, з TLS між edge та origin</text><text x="40" y="140" font-size="18" fill="#66717e" text-anchor="start">1. ВИЗНАЧЕННЯ АДРЕСИ</text><rect x="40" y="170" width="260" height="120" rx="16" fill="#fff" stroke="#dce3ea" stroke-width="2"/><text x="170" y="218" font-size="28" fill="#2c3e50" text-anchor="middle">Браузер</text><text x="170" y="257" font-size="21" fill="#66717e" text-anchor="middle">Шукає example.net</text><rect x="860" y="170" width="300" height="120" rx="16" fill="#fff" stroke="#dce3ea" stroke-width="2"/><text x="1010" y="218" font-size="28" fill="#2c3e50" text-anchor="middle">DoH-resolver</text><text x="1010" y="257" font-size="21" fill="#66717e" text-anchor="middle">Наприклад, 1.1.1.1</text><path d="M300 205 L850 205" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="575" y="191" font-size="22" fill="#2c3e50" text-anchor="middle">DNS-запит усередині HTTPS</text><path d="M850 265 L310 265" fill="none" stroke="#52677e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#navy)"/><text x="575" y="251" font-size="22" fill="#52677e" text-anchor="middle">Відповідь: IP edge-сервера</text><text x="40" y="340" font-size="23" fill="#66717e" text-anchor="start">DNS-resolver не передає наступний вебзапит до сайту.</text><text x="40" y="409" font-size="18" fill="#66717e" text-anchor="start">2. ЗАПИТ ДО САЙТУ</text><rect x="40" y="440" width="260" height="120" rx="16" fill="#fff" stroke="#dce3ea" stroke-width="2"/><text x="170" y="490" font-size="28" fill="#2c3e50" text-anchor="middle">Браузер</text><text x="170" y="529" font-size="21" fill="#66717e" text-anchor="middle">Запитує сторінку</text><rect x="440" y="440" width="300" height="120" rx="16" fill="#fff8ef" stroke="#dce3ea" stroke-width="2"/><text x="590" y="490" font-size="28" fill="#2c3e50" text-anchor="middle">CDN / edge</text><text x="590" y="529" font-size="21" fill="#66717e" text-anchor="middle">Reverse proxy</text><rect x="900" y="440" width="260" height="120" rx="16" fill="#fff" stroke="#dce3ea" stroke-width="2"/><text x="1030" y="490" font-size="28" fill="#2c3e50" text-anchor="middle">Origin</text><text x="1030" y="529" font-size="21" fill="#66717e" text-anchor="middle">Сервер застосунку</text><path d="M300 500 L430 500" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="365" y="478" font-size="20" fill="#2c3e50" text-anchor="middle">TLS №1</text><path d="M740 500 L890 500" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="820" y="478" font-size="20" fill="#2c3e50" text-anchor="middle">TLS №2</text><text x="820" y="539" font-size="18" fill="#66717e" text-anchor="middle">за потреби</text><rect x="350" y="600" width="480" height="98" rx="16" fill="#fff8ef" stroke="#dce3ea" stroke-width="2"/><text x="590" y="639" font-size="24" fill="#2c3e50" text-anchor="middle">TLS №1 закінчується на edge.</text><text x="590" y="675" font-size="22" fill="#66717e" text-anchor="middle">Тут доступний HTTP-вміст запиту.</text><text x="40" y="753" font-size="23" fill="#66717e" text-anchor="start">Resolver бачить DNS-запит. TLS-проксі бачить запит до сайту.</text><text x="40" y="791" font-size="23" fill="#66717e" text-anchor="start">Це різні ролі, навіть якщо обидва сервіси надає одна компанія.</text></g></svg>