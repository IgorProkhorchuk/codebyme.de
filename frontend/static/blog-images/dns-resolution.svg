<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Шлях рекурсивного DNS-запиту</title><desc id="desc">Resolver сам звертається до кожного рівня ієрархії. Сервери root і .net повертають делегування.</desc><defs><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#e67e22" stroke-width="1.6"/></marker><marker id="navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#52677e" stroke-width="1.6"/></marker></defs><rect width="1200" height="760" rx="20" fill="#f4f6f8"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="40" y="55" font-size="34" fill="#2c3e50" text-anchor="start">Як resolver знаходить відповідь</text><text x="40" y="92" font-size="23" fill="#66717e" text-anchor="start">Спрощений приклад без кешу · www.example.net</text><rect x="40" y="310" width="240" height="145" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="160" y="355" font-size="28" fill="#2c3e50" text-anchor="middle">Клієнт</text><text x="160" y="397" font-size="22" fill="#66717e" text-anchor="middle">A-запит</text><text x="160" y="430" font-size="20" fill="#66717e" text-anchor="middle">www.example.net</text><rect x="390" y="125" width="260" height="540" rx="16" fill="#fff8ef" stroke="#dce3ea" stroke-width="2"/><text x="520" y="350" font-size="27" fill="#2c3e50" text-anchor="middle">Рекурсивний</text><text x="520" y="385" font-size="30" fill="#2c3e50" text-anchor="middle">resolver</text><text x="520" y="435" font-size="22" fill="#66717e" text-anchor="middle">Пошук + кеш</text><path d="M 280 350 L 385 350" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="330" y="330" font-size="18" fill="#2c3e50" text-anchor="middle">1 · Запит</text><path d="M 385 425 L 285 425" fill="none" stroke="#52677e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#navy)"/><text x="332" y="462" font-size="18" fill="#52677e" text-anchor="middle">5 · A-запис</text><rect x="920" y="140" width="240" height="135" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="1040" y="188" font-size="28" fill="#2c3e50" text-anchor="middle">Root</text><text x="1040" y="232" font-size="18" fill="#66717e" text-anchor="middle">Коренева зона</text><path d="M 650 170 L 912 170" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="785" y="158" font-size="18" fill="#2c3e50" text-anchor="middle">2 · Запит</text><path d="M 913 245 L 658 245" fill="none" stroke="#52677e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#navy)"/><text x="785" y="231" font-size="19" fill="#52677e" text-anchor="middle">NS для .net</text><rect x="920" y="330" width="240" height="135" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="1040" y="378" font-size="28" fill="#2c3e50" text-anchor="middle">.net</text><text x="1040" y="422" font-size="18" fill="#66717e" text-anchor="middle">Зона верхнього рівня</text><path d="M 650 360 L 912 360" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="785" y="348" font-size="18" fill="#2c3e50" text-anchor="middle">3 · Запит</text><path d="M 913 435 L 658 435" fill="none" stroke="#52677e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#navy)"/><text x="785" y="421" font-size="19" fill="#52677e" text-anchor="middle">NS для example.net</text><rect x="920" y="520" width="240" height="135" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="1040" y="568" font-size="28" fill="#2c3e50" text-anchor="middle">example.net</text><text x="1040" y="612" font-size="18" fill="#66717e" text-anchor="middle">Авторитетний сервер</text><path d="M 650 550 L 912 550" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="785" y="538" font-size="18" fill="#2c3e50" text-anchor="middle">4 · A www.example.net?</text><path d="M 913 625 L 658 625" fill="none" stroke="#52677e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#navy)"/><text x="785" y="611" font-size="19" fill="#52677e" text-anchor="middle">A 203.0.113.10</text><text x="40" y="722" font-size="22" fill="#66717e" text-anchor="start">Суцільні стрілки — запити. Пунктирні — відповіді. IP-адреса умовна.</text></g></svg>