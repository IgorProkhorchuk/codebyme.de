<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Системний DNS та браузерний DoH</title><desc id="desc">CLI звертається через системний resolver, браузер може напряму звертатися до власного DoH-сервісу.</desc><defs><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#e67e22" stroke-width="1.6"/></marker><marker id="navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#52677e" stroke-width="1.6"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f4f6f8"/><g font-family="Inter, Segoe UI, Arial, sans-serif"><text x="40" y="55" font-size="34" fill="#2c3e50" text-anchor="start">Системний DNS і власний DoH браузера</text><text x="40" y="95" font-size="23" fill="#66717e" text-anchor="start">Налаштування браузера не змінюють DNS інших програм</text><text x="40" y="150" font-size="18" fill="#66717e" text-anchor="start">ПРОГРАМА ЧЕРЕЗ СИСТЕМУ</text><rect x="40" y="175" width="280" height="120" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="180" y="225" font-size="26" fill="#2c3e50" text-anchor="middle">CLI-програма</text><text x="180" y="263" font-size="21" fill="#66717e" text-anchor="middle">Наприклад, curl</text><rect x="440" y="175" width="290" height="120" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="585" y="225" font-size="25" fill="#2c3e50" text-anchor="middle">Системний resolver</text><text x="585" y="263" font-size="21" fill="#66717e" text-anchor="middle">Параметри ОС / VPN</text><rect x="870" y="175" width="290" height="120" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="1015" y="225" font-size="26" fill="#2c3e50" text-anchor="middle">DNS-сервіс A</text><text x="1015" y="263" font-size="21" fill="#66717e" text-anchor="middle">Вибраний у системі</text><path d="M 320 235 L 430 235" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><path d="M 730 235 L 860 235" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="795" y="215" font-size="19" fill="#66717e" text-anchor="middle">DNS</text><text x="40" y="375" font-size="18" fill="#66717e" text-anchor="start">БРАУЗЕР ІЗ ВЛАСНИМ DoH</text><rect x="40" y="405" width="280" height="120" rx="16" fill="#ffffff" stroke="#dce3ea" stroke-width="2"/><text x="180" y="455" font-size="28" fill="#2c3e50" text-anchor="middle">Браузер</text><text x="180" y="493" font-size="19" fill="#66717e" text-anchor="middle">Власний DoH увімкнено</text><rect x="870" y="405" width="290" height="120" rx="16" fill="#fff8ef" stroke="#dce3ea" stroke-width="2"/><text x="1015" y="455" font-size="26" fill="#2c3e50" text-anchor="middle">DNS-сервіс B</text><text x="1015" y="493" font-size="21" fill="#66717e" text-anchor="middle">Вибраний у браузері</text><path d="M 320 465 L 860 465" fill="none" stroke="#e67e22" stroke-width="3"  marker-end="url(#orange)"/><text x="590" y="440" font-size="24" fill="#2c3e50" text-anchor="middle">DNS через HTTPS</text><text x="590" y="505" font-size="18" fill="#66717e" text-anchor="middle">Окремий шлях; можливий bootstrap через ОС</text><text x="40" y="595" font-size="22" fill="#66717e" text-anchor="start">Сервіси A і B можуть збігатися. Fallback залежить від режиму браузера.</text><text x="40" y="635" font-size="22" fill="#66717e" text-anchor="start">Після отримання адреси з’єднання із сайтом встановлюється окремо.</text></g></svg>